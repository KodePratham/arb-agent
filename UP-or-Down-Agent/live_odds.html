<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Predict.fun Live Odds</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      background: #0f172a;
      color: #e2e8f0;
    }
    .card {
      max-width: 760px;
      padding: 20px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #111827;
    }
    .row { margin: 8px 0; }
    .label { color: #94a3b8; }
    .value { font-weight: 600; }
    input, button {
      background: #0b1220;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 14px;
    }
    input { width: 420px; }
    button { cursor: pointer; }
    .ok { color: #22c55e; }
    .warn { color: #f59e0b; }
    .mono { font-family: Consolas, monospace; }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="margin-top:0;">Predict.fun BTC/USD Live Odds</h2>

    <div class="row">
      <span class="label">API Key:</span>
      <input id="apiKey" type="password" placeholder="Paste PREDICTFUN_API_KEY" />
      <button id="startBtn">Start</button>
    </div>

    <div class="row"><span class="label">Status:</span> <span id="status" class="warn">Idle</span></div>
    <div class="row"><span class="label">Market URL:</span> <span id="marketUrl" class="mono">-</span></div>
    <div class="row"><span class="label">Market ID:</span> <span id="marketId" class="value">-</span></div>
    <div class="row"><span class="label">Title:</span> <span id="title" class="value">-</span></div>
    <hr style="border-color:#334155; margin:14px 0;" />
    <div class="row"><span class="label">Up best bid:</span> <span id="upBid" class="value">-</span></div>
    <div class="row"><span class="label">Up best ask:</span> <span id="upAsk" class="value">-</span></div>
    <div class="row"><span class="label">Up mid odds:</span> <span id="upMid" class="value">-</span></div>
    <div class="row"><span class="label">Down mid odds:</span> <span id="downMid" class="value">-</span></div>
    <div class="row"><span class="label">BTC/USD live price:</span> <span id="btcPrice" class="value">-</span></div>
    <div class="row"><span class="label">Last update:</span> <span id="lastUpdate" class="mono">-</span></div>
  </div>

  <script>
    const API_BASE = "https://api.predict.fun";
    const WS_BASE = "wss://ws.predict.fun/ws";

    const statusEl = document.getElementById("status");
    const marketUrlEl = document.getElementById("marketUrl");
    const marketIdEl = document.getElementById("marketId");
    const titleEl = document.getElementById("title");
    const upBidEl = document.getElementById("upBid");
    const upAskEl = document.getElementById("upAsk");
    const upMidEl = document.getElementById("upMid");
    const downMidEl = document.getElementById("downMid");
    const btcPriceEl = document.getElementById("btcPrice");
    const lastUpdateEl = document.getElementById("lastUpdate");
    const apiKeyInput = document.getElementById("apiKey");
    const startBtn = document.getElementById("startBtn");

    const queryApiKey = new URLSearchParams(window.location.search).get("apiKey") || "";
    const savedApiKey = localStorage.getItem("predictfun_api_key") || "";
    apiKeyInput.value = queryApiKey || savedApiKey;

    let ws = null;
    let reconnectTimer = null;

    function setStatus(text, ok = false) {
      statusEl.textContent = text;
      statusEl.className = ok ? "ok" : "warn";
    }

    function etDateYYYYMMDD() {
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: "America/New_York",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
      }).formatToParts(new Date());

      const map = Object.fromEntries(parts.map(p => [p.type, p.value]));
      return `${map.year}-${map.month}-${map.day}`;
    }

    function slugForToday() {
      return `btc-usd-up-down-${etDateYYYYMMDD()}-12-00-daily`;
    }

    function fmtPct(v) {
      if (v === null || v === undefined || Number.isNaN(v)) return "N/A";
      return `${(v * 100).toFixed(2)}%`;
    }

    function bestPrices(orderbook) {
      const bids = orderbook?.bids || [];
      const asks = orderbook?.asks || [];
      const bestBid = bids.length ? Math.max(...bids.map(b => Number(b[0]))) : null;
      const bestAsk = asks.length ? Math.min(...asks.map(a => Number(a[0]))) : null;
      return { bestBid, bestAsk };
    }

    function fmtUsd(v) {
      if (v === null || v === undefined || Number.isNaN(v)) return "N/A";
      return `$${Number(v).toLocaleString(undefined, { maximumFractionDigits: 2 })}`;
    }

    async function resolveMarket(slug, apiKey) {
      let cursor = null;
      for (let i = 0; i < 12; i++) {
        const params = new URLSearchParams({
          first: "50",
          status: "OPEN",
          marketVariant: "CRYPTO_UP_DOWN",
        });
        if (cursor) params.set("after", cursor);

        const resp = await fetch(`${API_BASE}/v1/markets?${params.toString()}`, {
          headers: {
            Accept: "application/json",
            "x-api-key": apiKey,
          },
        });

        if (!resp.ok) throw new Error(`Market fetch failed: HTTP ${resp.status}`);
        const payload = await resp.json();
        const found = (payload.data || []).find(m => m.categorySlug === slug);
        if (found) return found;

        cursor = payload.cursor;
        if (!cursor) break;
      }

      throw new Error(`Market not found for slug: ${slug}`);
    }

    function renderOdds(bestBid, bestAsk) {
      const midYes = (bestBid !== null && bestAsk !== null) ? (bestBid + bestAsk) / 2 : null;
      const midDown = midYes !== null ? (1 - midYes) : null;

      upBidEl.textContent = fmtPct(bestBid);
      upAskEl.textContent = fmtPct(bestAsk);
      upMidEl.textContent = fmtPct(midYes);
      downMidEl.textContent = fmtPct(midDown);
      lastUpdateEl.textContent = new Date().toLocaleTimeString();
    }

    function connectWebSocket(marketId, priceFeedId, apiKey) {
      if (ws) ws.close();
      if (reconnectTimer) clearTimeout(reconnectTimer);

      ws = new WebSocket(`${WS_BASE}?apiKey=${encodeURIComponent(apiKey)}`);

      ws.onopen = () => {
        setStatus("Connected", true);
        ws.send(JSON.stringify({
          method: "subscribe",
          requestId: 1,
          params: [`predictOrderbook/${marketId}`],
        }));
        if (priceFeedId) {
          ws.send(JSON.stringify({
            method: "subscribe",
            requestId: 2,
            params: [`assetPriceUpdate/${priceFeedId}`],
          }));
        }
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);

        if (msg.type === "M" && msg.topic === "heartbeat") {
          ws.send(JSON.stringify({ method: "heartbeat", data: msg.data }));
          return;
        }

        if (msg.type !== "M") return;
        const topic = msg.topic || "";

        if (topic.startsWith("assetPriceUpdate/")) {
          const price = Number((msg.data || {}).price);
          btcPriceEl.textContent = fmtUsd(price);
          lastUpdateEl.textContent = new Date().toLocaleTimeString();
          return;
        }

        if (!topic.startsWith("predictOrderbook/")) return;

        const { bestBid, bestAsk } = bestPrices(msg.data || {});
        renderOdds(bestBid, bestAsk);
      };

      ws.onclose = () => {
        setStatus("Disconnected. Reconnecting in 3s...");
        reconnectTimer = setTimeout(() => connectWebSocket(marketId, priceFeedId, apiKey), 3000);
      };

      ws.onerror = () => {
        setStatus("WebSocket error");
      };
    }

    async function start() {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) {
        setStatus("Enter API key first");
        return;
      }

      localStorage.setItem("predictfun_api_key", apiKey);
      setStatus("Resolving market...");

      try {
        const query = new URLSearchParams(window.location.search);
        const preMarketId = query.get("marketId");
        const preTitle = query.get("title");
        const preSlug = query.get("slug");
        const prePriceFeedId = query.get("priceFeedId");

        let market;
        let slug;

        if (preMarketId && preSlug) {
          slug = preSlug;
          market = {
            id: Number(preMarketId),
            title: preTitle || "BTC/USD Up or Down",
            variantData: { priceFeedId: prePriceFeedId || "" },
          };
        } else {
          slug = slugForToday();
          market = await resolveMarket(slug, apiKey);
        }

        const marketUrl = `https://predict.fun/market/${slug}`;

        marketUrlEl.textContent = marketUrl;
        marketIdEl.textContent = String(market.id);
        titleEl.textContent = market.title || "N/A";

        const priceFeedId = (market.variantData || {}).priceFeedId || "";
        if (!priceFeedId) {
          setStatus("Connected (no price feed ID found)", true);
        }

        connectWebSocket(market.id, priceFeedId, apiKey);
      } catch (err) {
        setStatus((err && err.message) ? err.message : String(err));
      }
    }

    startBtn.addEventListener("click", start);

    if (queryApiKey) {
      start();
    }
  </script>
</body>
</html>
